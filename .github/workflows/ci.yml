name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacoes:
    name: Tipos, testes unitários e build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:types
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  rls:
    name: Migration e RLS (PostgreSQL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Testar migration e políticas RLS
        run: bash supabase/tests/run_local.sh

  e2e:
    name: Teste de fumaça no navegador
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Subir o app (modo local, sem Supabase)
        run: |
          npm run dev -- --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173 > /dev/null && exit 0; sleep 1; done
          cat vite.log; exit 1
      - run: npm run test:e2e
